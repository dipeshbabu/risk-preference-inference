[project]
name = "risk-shift-bench"
version = "0.1.0"
description = "Verifier-drift detection and frozen-route evaluation for agent updates under task shift."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "numpy>=2,<3",
    "pytest>=8.4,<9",
]
inference = [
    "hf-transfer==0.1.9",
    "huggingface-hub==0.36.2",
    "numpy>=2,<3",
    "psutil==7.2.2",
    "sentencepiece==0.2.0",
    "transformers==4.49.0",
]

[project.urls]
Repository = "https://github.com/dipeshbabu/risk-shift-bench"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["riskshiftbench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["riskshiftbench/tests"]
